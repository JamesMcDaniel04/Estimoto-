app = "estimoto-plus-api"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  ENVIRONMENT = "production"
  PHOTO_DIR = "/data/photos"
  WEB_DIR = "/app/web"
  DISCOVERY_ENABLED = "true"
  DISCOVERY_DAILY_REQUESTS = "30"
  DISCOVERY_DAILY_BYTES = "8388608"

[deploy]
  release_command = "alembic upgrade head"
  strategy = "rolling"

[mounts]
  source = "plus_photos"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/ready"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
