name: estimoto_plus
description: "Estimoto + customer garage, estimates, repairs and technician connections."
publish_to: 'none'
version: 0.1.0+5

environment:
  sdk: ^3.12.1

dependencies:
  crypto: 3.0.7
  path_provider: 2.1.6
  web: 1.1.1
  webview_flutter: 4.14.1
  webview_flutter_android: 4.14.1
  webview_flutter_wkwebview: 3.26.1
  permission_handler: 13.0.2
  cupertino_icons: 1.0.8
  flutter:
    sdk: flutter
  flutter_secure_storage: 9.2.4
  http: 1.6.0
  http_parser: 4.1.2
  image_picker: 1.2.2
  supabase_flutter: 2.14.2
  url_launcher: 6.3.2
  timezone: 0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/estimoto-plus-icon.png
    - assets/vehicles/2021-toyota-tacoma.webp
    - assets/vehicles/2022-audi-q5.webp
