name: Estimoto Plus checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pytest -q
        working-directory: backend
      - run: python scripts/smoke_api.py
      - run: python scripts/smoke_discovery.py
      - run: python scripts/smoke_calendar.py
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: plus_launch_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PLUS_TEST_POSTGRES_URL: postgresql+psycopg://postgres:local_ci_only@127.0.0.1:5432/plus_launch_test
      CALENDAR_TEST_POSTGRES_URL: postgresql+psycopg://postgres:local_ci_only@127.0.0.1:5432/plus_launch_test
      DISCOVERY_TEST_POSTGRES_URL: postgresql+psycopg://postgres:local_ci_only@127.0.0.1:5432/plus_launch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.lock
      - name: Create test-only Data API roles for access-denial checks
        run: |
          python - <<'PY'
          import os
          import psycopg
          dsn = os.environ['PLUS_TEST_POSTGRES_URL'].replace('postgresql+psycopg://', 'postgresql://', 1)
          with psycopg.connect(dsn) as connection:
              connection.execute('CREATE ROLE anon NOLOGIN NOSUPERUSER NOBYPASSRLS')
              connection.execute('CREATE ROLE authenticated NOLOGIN NOSUPERUSER NOBYPASSRLS')
          PY
      - run: python -m pytest -q
        working-directory: backend
  capture-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: capture-web/package-lock.json
      - run: npm ci --ignore-scripts --legacy-peer-deps
        working-directory: capture-web
      - run: bash scripts/build_capture.sh
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.lock
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - run: flutter analyze --no-pub
        working-directory: app
      - run: flutter test --no-pub
        working-directory: app
      - run: flutter build web --no-pub --dart-define=PLUS_DEMO=true
        working-directory: app
      - run: python scripts/smoke_api.py --flutter-client
