name: Estimoto Plus checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pytest -q
        working-directory: backend
      - run: python scripts/smoke_api.py
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.lock
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - run: flutter analyze --no-pub
        working-directory: app
      - run: flutter test --no-pub
        working-directory: app
      - run: flutter build web --no-pub --dart-define=PLUS_DEMO=true
        working-directory: app
      - run: python scripts/smoke_api.py --flutter-client
