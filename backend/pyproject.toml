[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "estimoto-plus-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.116.1", "uvicorn==0.35.0", "SQLAlchemy==2.0.43",
  "alembic==1.16.5", "httpx==0.28.1", "python-multipart==0.0.20",
  "psycopg[binary]==3.2.9", "pydantic-settings==2.10.1", "Pillow==11.3.0", "pypdf==6.18.1"
]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
